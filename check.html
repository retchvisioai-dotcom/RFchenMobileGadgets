<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warranty &amp; repair check – MC Gadgets</title>
<link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="css/app.css"></head>
<body>
<header class="top"><div class="wrap"><img src="assets/logo.svg" alt="" width="48" height="48"><div><h1>MC GADGETS</h1><p>Warranty &amp; repair check</p></div></div></header>
<main class="wrap" style="padding-top:16px;max-width:560px">
<p><a href="index.html">← Back to stock</a></p>
<form id="wf" class="box"><h2>Warranty check</h2>
  <label for="imei">IMEI (dial *#06# on the phone)</label><input id="imei" type="text" inputmode="numeric" maxlength="20" required>
  <button class="btn" type="submit" style="margin-top:8px">Check</button><p id="wr" role="status"></p></form>
<form id="rf" class="box" style="margin-top:12px"><h2>Repair status</h2>
  <label for="code">Repair code (e.g. R-1A2B3C)</label><input id="code" type="text" maxlength="12" required>
  <button class="btn" type="submit" style="margin-top:8px">Check</button><p id="rr" role="status"></p></form>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/ui.js"></script>
<script>
const $ = id => document.getElementById(id);
$('wf').addEventListener('submit', async e => { e.preventDefault(); $('wr').textContent = '…';
  try { const w = await api.warranty($('imei').value);
    $('wr').textContent = w ? w.model + ' – warranty ' + w.status.toLowerCase() + ' until ' + w.ends : 'No warranty found for that IMEI.';
  } catch (er) { $('wr').textContent = friendly(er); } });
$('rf').addEventListener('submit', async e => { e.preventDefault(); $('rr').textContent = '…';
  try { const r = await api.repairStatus($('code').value);
    $('rr').textContent = r ? r.device + ' – ' + r.status.replace('_', ' ') + ' (updated ' + new Date(r.updated_at).toLocaleDateString('en-PH') + ')' : 'No repair found with that code.';
  } catch (er) { $('rr').textContent = friendly(er); } });
</script>
</body></html>
