<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>MC Gadgets – Staff POS</title>
<link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../css/app.css">
<style>.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.row .grow{flex:1;min-width:180px}.row .acts{display:flex;gap:6px;flex-wrap:wrap}.btn.sm{padding:6px 10px;font-size:14px}.pill{font-size:12px;background:var(--soft);color:var(--p);border-radius:999px;padding:2px 8px}#reader{width:100%}@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0}}</style></head>
<body>
<header class="top"><div class="wrap"><img src="../assets/logo.svg" alt="" width="48" height="48"><div><h1>MC GADGETS · Staff</h1><p id="who">Not signed in</p></div><button id="out" class="btn alt sm" style="margin-left:auto" hidden>Sign out</button></div></header>
<main class="wrap">
<form id="login" class="box" style="max-width:420px;margin:20px auto">
  <h2>Staff sign in</h2>
  <label for="em">Email</label><input id="em" type="text" inputmode="email" autocomplete="username" required>
  <label for="pw" style="margin-top:8px;display:block">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <div id="lerr" class="err" role="alert"></div>
  <button class="btn" id="lgo" type="submit">Sign in</button>
</form>
<div id="app" hidden>
  <div class="tabs" id="tabs">
    <button class="chip" data-t="stock" aria-pressed="true">Stock &amp; sell</button>
    <button class="chip" data-t="apps" aria-pressed="false">Applications</button>
    <button class="chip" data-t="repairs" aria-pressed="false">Repairs</button>
    <button class="chip" data-t="transfers" aria-pressed="false">Transfers</button>
  </div>
  <div id="msg" class="err" role="alert"></div>
  <div id="view"></div>
</div>
</main>
<dialog id="dlg"></dialog>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/ui.js"></script><script src="../js/auth.js"></script>
<script src="../vendor/html5-qrcode.min.js"></script>
<script src="../js/pos.js"></script>
</body></html>
